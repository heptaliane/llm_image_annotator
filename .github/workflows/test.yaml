name: mypy

on:
  push:


jobs:
  mypy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Setup python
        run: uv sync --locked --all-extras --dev

      - name: Run mypy check
        run: make mypy
